[project]
name = "simulate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.2",
    "langgraph>=0.6,<1.0",
    "langgraph-checkpoint-postgres>=3.0,<3.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-ai-slim[anthropic,openai]>=2.24.0",
    "pydantic-settings>=2.14.2",
    "psycopg[binary]>=3.2,<4.0",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "textual>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project.scripts]
lab = "app.cli.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx>=0.28.1",
]

[tool.ruff]
src = ["src"]
line-length = 100
extend-exclude = [".agents", ".slim"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a configured PostgreSQL database",
    "live: requires a hosted model and/or LangSmith credentials",
]
